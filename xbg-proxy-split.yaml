# Nordic as its own Home Assistant scanner (custom_components/ab_nordic).
# The ESP32 stays the connectable ESPHome Bluetooth proxy; the Nordic's raw
# SCAN2 stream goes to the HA integration over the encrypted serial proxy.
# Without a subscribed client, Nordic advertisements are dropped.
packages:
  base: !include xbg-proxy.yaml

serial_proxy:
  - id: nordic_serial
    uart_id: nordic_uart
    # The HA integration finds the port by this name.
    name: Nordic scanner
    port_type: TTL

ab_nordic:
  serial_proxy_id: nordic_serial
  serial_mode: split
