name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tests
        run: |
          python3 -m unittest discover -s tests -v
          g++ -std=c++17 -Wall -Wextra -Werror tests/stock_copy.cpp -o /tmp/stock-copy
          /tmp/stock-copy
      - name: Compile firmware
        run: ./build.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ab-ble-gateway-v4-firmware
          path: build/ab-ble-gateway-v4.ota.bin
          if-no-files-found: error
