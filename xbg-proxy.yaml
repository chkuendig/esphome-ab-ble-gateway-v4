esphome:
  name: ab-ble-gateway-v4
  name_add_mac_suffix: true
  friendly_name: AB BLE Gateway V4
  min_version: 2026.10.2
  compile_process_limit: 2
  build_path: private/build

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 4MB
  partitions: layout-candidates/original-stock.csv
  framework:
    type: esp-idf
    # Native encrypted API/OTA only; no MQTT or HTTP/TLS client transport.
    sdkconfig_options:
      # Keep assertion checks, omit their per-site expression/file strings.
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT: "y"
      CONFIG_COMPILER_OPTIMIZATION_CHECKS_SILENT: "y"
      # A proxy is a GATT client; no local GATT services are exposed.
      CONFIG_BT_GATTS_ENABLE: "n"
      # Keep ESPHome proxy logs; omit the underlying stack's debug strings.
      CONFIG_BT_STACK_NO_LOG: "y"
      # No filesystem/stdio devices: UART uses the driver directly, sockets
      # remain available. Keep numeric IDF errors without their lookup table.
      CONFIG_VFS_SUPPORT_IO: "n"
      CONFIG_ESP_ERR_TO_NAME_LOOKUP: "n"
      CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT: "n"
      CONFIG_MBEDTLS_PEM_WRITE_C: "n"
      CONFIG_MBEDTLS_X509_CRL_PARSE_C: "n"
      CONFIG_MBEDTLS_X509_CSR_PARSE_C: "n"

# Keep the inspected stock geometry. First boot preserves verified current
# stock in factory before starting ESPHome. Only app-only OTA is applicable.
logger:
  level: ERROR
  baud_rate: 115200

# Local provisioning through UART0 (separate from Nordic RX32/TX33).
improv_serial:

api:
  encryption:
    # Per-device key lives in NVS; never bake a shared/personal key into releases.
  reboot_timeout: 0s

ota:
  - platform: esphome
    # ab_settings requires encryption using the per-device provisioned API key.

safe_mode:
  num_attempts: 3
  boot_is_good_after: 2min
  reboot_timeout: 10min

wifi:
  # ab_settings imports existing stock credentials into ESPHome preferences.
  power_save_mode: none
  reboot_timeout: 0s

# Passive scans do not prevent HA from initiating active GATT connections.
esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  id: native_proxy
  active: true
  connection_slots: 1

# Both receivers forward through the encrypted ESPHome Bluetooth API.
uart:
  id: nordic_uart
  tx_pin: GPIO33
  rx_pin: GPIO32
  baud_rate: 115200
  rx_buffer_size: 4096

external_components:
  - source:
      type: local
      path: components

ab_nordic:
  uart_id: nordic_uart
  proxy_id: native_proxy
  id: nordic

ab_settings:

stock_recovery:
  id: recovery

ab_button:
  recovery_id: recovery

button:
  - platform: template
    name: Accept Tested Proxy Firmware
    entity_category: config
    on_press:
      - lambda: id(recovery).accept();
  - platform: template
    name: Restore Stock Gateway Firmware
    entity_category: config
    on_press:
      - lambda: id(recovery).restore_stock();
